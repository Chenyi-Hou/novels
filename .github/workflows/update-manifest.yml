name: Update book manifest

# 每次 push 到 main 后，自动重新生成 manifest.json 并提交回去
# 这样你只需 git add / commit / push，清单永远与仓库里的 .txt 同步
on:
  push:
    branches: [main]
  workflow_dispatch:   # 也支持在 Actions 页面手动触发

permissions:
  contents: write     # 允许 action 把更新后的 manifest.json 推回仓库

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Regenerate manifest.json
        run: node gen-manifest.js

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          if git diff --cached --quiet; then
            echo "manifest.json 已是最新，无需提交"
          else
            git commit -m "ci: auto-update manifest.json [skip ci]"
            git push origin HEAD:main
          fi
